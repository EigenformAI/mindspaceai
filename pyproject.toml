[project]
name = "mindspaceai"
version = "0.1.0"
description = "Emerging concepts in AI discussion space: collect, cluster, score coherence, visualise"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "feedparser>=6.0.11",      # rss
    "requests>=2.31.0",        # hackernews, hf_papers, lesswrong, github_trending
    "beautifulsoup4>=4.12.3",  # github_trending
    "openai>=1.0",             # grok_twitter (xAI is OpenAI-compatible), embeddings
    "pyyaml>=6.0.1",           # config.yaml
    "python-dotenv>=1.0",
    "tqdm>=4.66",              # embed — imported directly, was only arriving
                               # transitively through umap-learn
    "numpy>=1.26,<2.5",        # numba, via umap-learn, requires <2.5
    "scikit-learn>=1.9.0",     # HDBSCAN, and TF-IDF for lexical coherence
    "scipy>=1.11",             # rankdata in coherence — was only arriving
                               # transitively through umap-learn
    "umap-learn>=0.5.12",
    "plotly>=5.20.0",
    "pandas>=2.2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]
